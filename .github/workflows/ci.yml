name: ci

# Runs the test suite on every push and pull request, on the platforms the
# plugin claims to support. The publish workflow stays separate: it only runs
# for a release tag and only after this workflow is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run the test suite
        run: npm test

      - name: Verify the package manifest
        run: |
          node -e "const p=require('./package.json'); if (p.private) throw new Error('package.json must not be private'); if (!p.repository?.url) throw new Error('repository.url is required for trusted publishing'); if (!p.engines?.node) throw new Error('engines.node is required'); if (!p.engines?.dsh) throw new Error('engines.dsh is required'); console.log(p.name, p.version)"

      - name: Verify the published npm archive
        shell: bash
        run: |
          npm pack --dry-run --json > npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-pack.json', 'utf8'));
          if (!Array.isArray(report) || !Array.isArray(report[0]?.files)) {
            throw new Error('npm pack did not return a valid file manifest');
          }
          const paths = new Set(report[0].files.map((file) => file.path));
          const required = [
            'index.js',
            'client.js',
            'cordis.patch.yml',
            'locale/en.json',
            'locale/zh.json',
            'icon.svg',
            'README.md',
            'CHANGELOG.md',
            'LICENSE',
            'SECURITY.md',
            'src/host/runtime-state.js',
            'src/host/text.js',
            'src/host/markdown.js',
            'src/host/glossary.js',
            'scripts/glossary-cli.mjs',
            'scripts/glossary-sarif.mjs',
            'scripts/run-glossary-action.mjs',
            'scripts/run-glossary-policy-review-action.mjs',
            'config/glossary-policy.example.json',
            'config/glossary-policy.schema.json',
          ];
          const missing = required.filter((path) => !paths.has(path));
          if (missing.length) {
            throw new Error('npm archive is missing required runtime or CLI files: ' + missing.join(', '));
          }
          const unexpected = [...paths].filter((path) =>
            path.startsWith('.github/') || path.startsWith('test/'),
          );
          if (unexpected.length) {
            throw new Error('npm archive contains development-only files: ' + unexpected.join(', '));
          }
          console.log('npm archive content check passed (' + paths.size + ' files)');
          NODE

  harness-compatibility:
    name: Harness ${{ matrix.harness.version }} / Linux / Node 24
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        harness:
          - version: "0.2.2-rc.4"
            ref: "3f321d32bfe382212a8ed8785c1d47a5a300aa23"
          - version: "0.2.2-rc.5"
            ref: "9c2670d3bce5275e0d1610272958121af87787bb"
    steps:
      - name: Check out Translation Pane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned DeepSeek Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.harness.ref }}
          path: deepseek-harness
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: 24.9.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.28.5
          package_json_file: deepseek-harness/package.json

      - name: Install the upstream workspace dependency graph
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build the upstream native system addon
        working-directory: deepseek-harness
        run: pnpm run build:native-system

      - name: Build the upstream Host libraries
        working-directory: deepseek-harness
        run: pnpm exec tsx scripts/compile-referenced-projects.ts host-libraries

      - name: Mount Translation Pane in the real Harness Cordis / AgentLoop context
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HARNESS_VERSION: ${{ matrix.harness.version }}
          DSH_COMPATIBILITY_MANIFEST: ${{ github.workspace }}/artifacts/harness-compatibility.json
        run: node scripts/run-harness-compatibility.mjs

      - name: Upload runtime compatibility evidence
        if: always() && hashFiles('artifacts/harness-compatibility.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-compatibility-${{ matrix.harness.version }}
          path: artifacts/harness-compatibility.json
          if-no-files-found: error
          retention-days: 30
