name: Bug report
description: Report a reproducible problem with Translation Pane.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please remove or redact credentials, personal information, source text, translated text, and other confidential content from logs and screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
      placeholder: A clear, concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Open Translation Pane.
        2. Select ...
        3. Enter a non-sensitive example ...
        4. Click Translate.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error code if available.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Translation Pane version
      placeholder: "1.3.0"
    validations:
      required: false
  - type: input
    id: harness-version
    attributes:
      label: DeepSeek Harness version
      placeholder: "0.2.2-rc.5"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS / Linux distribution"
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Translation route
      description: Select the route shown by the panel, or choose unknown.
      options:
        - Direct endpoint
        - Translation service (ctx.translator)
        - Unknown
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant error codes or sanitized logs. Do not include source or translated content, credentials, tokens, or personal data.
      render: text
    validations:
      required: false
